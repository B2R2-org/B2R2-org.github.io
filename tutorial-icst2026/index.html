<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Information about the B2R2 tutorial session at ICST 2026 will be available soon." />
    <title>ICST 2026 Tutorial | B2R2</title>
    <link rel="canonical" href="https://b2r2.org/tutorial-icst2026/" />
    <style>
      :root {
        color-scheme: light;
        --bg-start: #f6efe5;
        --bg-end: #e4eef8;
        --text-main: #16202b;
        --text-muted: #526171;
        --panel: rgba(255, 255, 255, 0.78);
        --panel-border: rgba(22, 32, 43, 0.08);
        --accent: #0b6aa2;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text-main);
        background:
          radial-gradient(circle at top, rgba(11, 106, 162, 0.14), transparent 32%),
          linear-gradient(135deg, var(--bg-start), var(--bg-end));
      }

      main {
        width: min(100%, 720px);
        padding: 48px 40px;
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        background: var(--panel);
        backdrop-filter: blur(10px);
        box-shadow: 0 24px 60px rgba(22, 32, 43, 0.12);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 16px;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: var(--accent);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.25rem, 6vw, 4rem);
        line-height: 1.05;
      }

      p {
        margin: 20px auto 0;
        max-width: 34rem;
        font-size: 1.05rem;
        line-height: 1.7;
        color: var(--text-muted);
      }
    </style>
  </head>

  <body>
    <main>
      <p class="eyebrow">B2R2 at ICST 2026</p>
      <h1>Under Construction</h1>
      <p>
        We are preparing a tutorial page for our ICST 2026 session.
        Details will be published here soon.
      </p>
    </main>
  </body>

</html>
